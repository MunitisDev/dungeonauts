name: Deploy to GitHub Pages

# Publishes a playable build so the slice can be tried on a real device:
# https://munitisdev.github.io/dungeonauts/
#
# ONE-TIME SETUP, by a repository admin:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Until that is done every run fails at configure-pages with "Get Pages site
# failed: Not Found". The workflow cannot do it itself: GITHUB_TOKEN is refused
# the create-a-Pages-site call ("Resource not accessible by integration"), even
# with `pages: write`. After the one-time switch, no further manual steps.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves the site from /<repo>/, so the bundle needs a matching base.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
