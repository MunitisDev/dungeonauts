name: Deploy to GitHub Pages

# Publishes a playable build so the slice can be tried on a real device:
# https://munitisdev.github.io/dungeonauts/
#
# ONE-TIME SETUP, by a repository admin:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Until that is done every run fails at configure-pages with "Get Pages site
# failed: Not Found". The workflow cannot do it itself: GITHUB_TOKEN is refused
# the create-a-Pages-site call ("Resource not accessible by integration"), even
# with `pages: write`. After the one-time switch, no further manual steps.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves the site from /<repo>/, so the bundle needs a matching base.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy job is not proof the right thing is live. If Pages is set to
  # "Deploy from a branch" instead of "GitHub Actions", this workflow still
  # succeeds while the published site is the raw repository: index.html then
  # points at /src/main.ts, which the browser refuses to execute. That failure
  # is invisible from the Actions tab, so check the real URL.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The published page must be the built bundle
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking $PAGE_URL"

          # Pages propagation is not instant.
          for attempt in $(seq 1 10); do
            body=$(curl -fsSL --max-time 20 "$PAGE_URL" || true)
            if printf '%s' "$body" | grep -q '/bundle/'; then
              echo "Built bundle is live."
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::$PAGE_URL is not serving the built site after 10 attempts."
              printf '%s\n' "$body" | head -40
              echo "::error::Set Settings -> Pages -> Source to \"GitHub Actions\"."
              exit 1
            fi
            echo "Attempt $attempt: not ready, retrying in 15s"
            sleep 15
          done

          if printf '%s' "$body" | grep -q '/src/main.ts'; then
            echo "::error::$PAGE_URL is serving the repository source, not the build."
            echo "::error::Set Settings -> Pages -> Source to \"GitHub Actions\"."
            exit 1
          fi

          # Repository files must not be reachable: their presence means the
          # branch is being published rather than dist/.
          for leaked in package.json vite.config.ts; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PAGE_URL}${leaked}")
            if [ "$code" = "200" ]; then
              echo "::error::${PAGE_URL}${leaked} is reachable — the branch is being published, not dist/."
              exit 1
            fi
          done

          echo "Deployment verified."
